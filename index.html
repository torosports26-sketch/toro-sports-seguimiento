
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Seguimiento de pedido | Toro Sports</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 550px;
      margin: 50px auto;
      padding: 25px;
    }

    .marca {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 35px;
    }

    .logo {
      display: block;
      width: 150px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 30px;
    }

    .tarjeta {
      background: #191919;
      border: 1px solid #303030;
      border-radius: 14px;
      padding: 25px;
    }

    .fila {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #333333;
    }

    .fila:last-child {
      border-bottom: none;
    }

    .etiqueta {
      color: #aaaaaa;
    }

    .valor {
      text-align: right;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .mensaje {
      text-align: center;
      color: #bbbbbb;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #777777;
      margin-top: 35px;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      main {
        margin: 25px auto;
        padding: 20px;
      }

      .tarjeta {
        padding: 18px;
      }

      .fila {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main>

    <div class="marca">
      <img
        id="logo-toro"
        class="logo"
        alt="Toro Sports"
      >
    </div>

    <h1>Seguimiento de pedido</h1>

    <div id="resultado" class="mensaje">
      Consultando pedido...
    </div>

    <footer>
      TORO SPORTS · Seguimiento de pedidos
    </footer>

  </main>

  <script>
    // LOGO OFICIAL DE TORO SPORTS
    const nombreLogo = "New Logo blanco (1).png";

    document.getElementById("logo-toro").src =
      "./" + encodeURIComponent(nombreLogo);

    // CONEXION CON SUPABASE
    const SUPABASE_URL =
      "https://naxhcvjrxhirfizhitsp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_sFSH8qeq6HweNdtkZJ8AmA_kUUhghEj";

    const resultado = document.getElementById("resultado");

    function agregarFila(contenedor, etiqueta, valor) {
      const fila = document.createElement("div");
      fila.className = "fila";

      const izquierda = document.createElement("span");
      izquierda.className = "etiqueta";
      izquierda.textContent = etiqueta;

      const derecha = document.createElement("span");
      derecha.className = "valor";
      derecha.textContent = valor ?? "—";

      fila.append(izquierda, derecha);
      contenedor.appendChild(fila);
    }

    function fecha(valor) {
      if (!valor) return "—";

      const partes = valor.split("-");

      return partes.length === 3
        ? `${partes[2]}/${partes[1]}/${partes[0]}`
        : valor;
    }

    async function consultarPedido() {
      const token = new URLSearchParams(
        window.location.search
      ).get("token");

      const uuid =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

      if (!token || !uuid.test(token)) {
        resultado.textContent =
          "El enlace de seguimiento no es válido.";
        return;
      }

      if (SUPABASE_KEY === "PEGA_AQUI_TU_CLAVE_PUBLICABLE") {
        resultado.textContent =
          "Falta configurar la clave publicable de Supabase.";
        return;
      }

      try {
        const respuesta = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/consultar_pedido`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
              p_token: token
            })
          }
        );

        if (!respuesta.ok) {
          throw new Error("Error de consulta");
        }

        const datos = await respuesta.json();
        const pedido = datos[0];

        if (!pedido) {
          resultado.textContent =
            "No encontramos un pedido con este enlace.";
          return;
        }

        const tarjeta = document.createElement("div");
        tarjeta.className = "tarjeta";

        agregarFila(tarjeta, "Cliente", pedido.cliente);
        agregarFila(tarjeta, "N.º de pedido", pedido.numero_pedido);
        agregarFila(tarjeta, "Productos", pedido.productos);
        agregarFila(tarjeta, "Cantidad", pedido.cantidad);
        agregarFila(tarjeta, "Estado", pedido.estado);
        agregarFila(
          tarjeta,
          "Fecha del pedido",
          fecha(pedido.fecha_pedido)
        );
        agregarFila(
          tarjeta,
          "Entrega estimada",
          fecha(pedido.fecha_entrega)
        );

        resultado.replaceWith(tarjeta);

      } catch (error) {
        resultado.textContent =
          "No pudimos consultar el pedido. Intentá nuevamente.";
      }
    }

    consultarPedido();
  </script>
</body>
</html>
