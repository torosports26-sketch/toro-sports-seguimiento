
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>Seguimiento de pedido | Toro Sports</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 590px;
      margin: 45px auto;
      padding: 22px;
    }

    .marca {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 35px;
    }

    .logo {
      display: block;
      width: 150px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 0 0 30px;
    }

    h2 {
      font-size: 17px;
      margin: 0 0 18px;
    }

    .tarjeta {
      background: #191919;
      border: 1px solid #303030;
      border-radius: 15px;
      padding: 24px;
      margin-bottom: 18px;
    }

    .fila {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #333333;
    }

    .fila:last-child {
      border-bottom: none;
    }

    .etiqueta {
      color: #aaaaaa;
    }

    .valor {
      text-align: right;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .estado {
      display: inline-block;
      padding: 8px 12px;
      background: #303030;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      text-align: right;
    }

    .progreso-numero {
      font-size: 29px;
      font-weight: bold;
      margin: 0 0 7px;
    }

    .progreso-subtitulo {
      font-size: 12px;
      color: #aaaaaa;
      margin-bottom: 17px;
    }

    .barra-fondo {
      height: 12px;
      background: #393939;
      border-radius: 30px;
      overflow: hidden;
    }

    .barra-relleno {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 30px;
      transition: width 0.6s ease;
    }

    .fechas {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .fecha-bloque {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .fecha-bloque:last-child {
      text-align: right;
    }

    .fecha-etiqueta {
      color: #999999;
      font-size: 12px;
    }

    .fecha-valor {
      font-size: 14px;
      font-weight: bold;
    }

    .aviso {
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.6;
      color: #999999;
    }

    .pago-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0 20px;
      border-bottom: 1px solid #333333;
    }

    .pago-total .importe {
      font-size: 25px;
      font-weight: bold;
    }

    .pago-fila {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 0;
      border-bottom: 1px solid #333333;
    }

    .pago-fila:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .pago-detalle {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .pago-nombre {
      font-weight: bold;
    }

    .pago-descripcion {
      color: #aaaaaa;
      font-size: 12px;
    }

    .pago-derecha {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      text-align: right;
    }

    .importe {
      font-size: 18px;
      font-weight: bold;
    }

    .insignia {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }

    .pagado {
      color: #8ee0aa;
      background: #183b27;
    }

    .pendiente {
      color: #f3d08d;
      background: #45351b;
    }

    .mensaje {
      text-align: center;
      color: #bbbbbb;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #777777;
      margin-top: 35px;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      main {
        margin: 25px auto;
        padding: 18px;
      }

      .tarjeta {
        padding: 18px;
      }

      .fila {
        font-size: 14px;
      }

      .progreso-numero {
        font-size: 25px;
      }

      .pago-total .importe {
        font-size: 22px;
      }

      .importe {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main>

    <div class="marca">
      <img
        id="logo-toro"
        class="logo"
        alt="Toro Sports"
      >
    </div>

    <h1>Seguimiento de pedido</h1>

    <div id="resultado" class="mensaje">
      Consultando pedido...
    </div>

    <footer>
      TORO SPORTS · Seguimiento de pedidos
    </footer>

  </main>

  <script>
    // LOGO OFICIAL DE TORO SPORTS
    const nombreLogo = "New Logo blanco (1).png";

    document.getElementById("logo-toro").src =
      "./" + encodeURIComponent(nombreLogo);

    // CONEXION CON SUPABASE
    const SUPABASE_URL =
      "https://naxhcvjrxhirfizhitsp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_sFSH8qeq6HweNdtkZJ8AmA_kUUhghEj";

    const resultado = document.getElementById("resultado");

    function crearElemento(tipo, clase, texto) {
      const elemento = document.createElement(tipo);

      if (clase) {
        elemento.className = clase;
      }

      if (texto !== undefined) {
        elemento.textContent = texto;
      }

      return elemento;
    }

    function agregarFila(contenedor, etiqueta, valor) {
      const fila = crearElemento("div", "fila");

      const izquierda = crearElemento(
        "span",
        "etiqueta",
        etiqueta
      );

      const derecha = crearElemento(
        "span",
        "valor",
        valor ?? "—"
      );

      fila.append(izquierda, derecha);
      contenedor.appendChild(fila);
    }

    function fecha(valor) {
      if (!valor) return "—";

      const partes = valor.split("-");

      return partes.length === 3
        ? `${partes[2]}/${partes[1]}/${partes[0]}`
        : valor;
    }

    function convertirFecha(valor) {
      if (!valor) return null;

      const partes = valor.split("-").map(Number);

      if (
        partes.length !== 3 ||
        partes.some(numero => !Number.isFinite(numero))
      ) {
        return null;
      }

      const fechaUTC = new Date(
        Date.UTC(partes[0], partes[1] - 1, partes[2])
      );

      if (
        fechaUTC.getUTCFullYear() !== partes[0] ||
        fechaUTC.getUTCMonth() !== partes[1] - 1 ||
        fechaUTC.getUTCDate() !== partes[2]
      ) {
        return null;
      }

      return fechaUTC.getTime();
    }

    function hoyUruguay() {
      const partes = new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: "America/Montevideo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).formatToParts(new Date());

      const obtener = tipo =>
        Number(
          partes.find(parte => parte.type === tipo).value
        );

      return Date.UTC(
        obtener("year"),
        obtener("month") - 1,
        obtener("day")
      );
    }

    function calcularProgreso(inicio, fin) {
      const fechaInicio = convertirFecha(inicio);
      const fechaFin = convertirFecha(fin);

      if (
        fechaInicio === null ||
        fechaFin === null ||
        fechaFin <= fechaInicio
      ) {
        return null;
      }

      const actual = hoyUruguay();

      const porcentaje =
        ((actual - fechaInicio) /
          (fechaFin - fechaInicio)) * 100;

      return Math.round(
        Math.max(0, Math.min(100, porcentaje))
      );
    }

    function calcularDiasRestantes(fechaEntrega) {
      const entrega = convertirFecha(fechaEntrega);

      if (entrega === null) {
        return "Fecha no disponible";
      }

      const diasRestantes = Math.ceil(
        (entrega - hoyUruguay()) / 86400000
      );

      if (diasRestantes > 1) {
        return diasRestantes + " días restantes";
      }

      if (diasRestantes === 1) {
        return "1 día restante";
      }

      if (diasRestantes === 0) {
        return "¡Entrega estimada para hoy!";
      }

      return "Fecha estimada superada";
    }

    function moneda(valor) {
      const numero = Number(valor);

      if (!Number.isFinite(numero)) {
        return "—";
      }

      return "$" + numero.toLocaleString(
        "es-UY",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      );
    }

    function crearInsignia(pagado) {
      return crearElemento(
        "span",
        "insignia " + (pagado ? "pagado" : "pendiente"),
        pagado ? "PAGADO" : "PENDIENTE"
      );
    }

    function crearFilaPago(
      contenedor,
      nombre,
      descripcion,
      importe,
      pagado
    ) {
      const fila = crearElemento("div", "pago-fila");

      const detalle = crearElemento(
        "div",
        "pago-detalle"
      );

      detalle.append(
        crearElemento("span", "pago-nombre", nombre),
        crearElemento(
          "span",
          "pago-descripcion",
          descripcion
        )
      );

      const derecha = crearElemento(
        "div",
        "pago-derecha"
      );

      derecha.append(
        crearElemento(
          "span",
          "importe",
          moneda(importe)
        ),
        crearInsignia(pagado)
      );

      fila.append(detalle, derecha);
      contenedor.appendChild(fila);
    }

    function crearProgreso(pedido) {
      const tarjeta = crearElemento(
        "section",
        "tarjeta"
      );

      tarjeta.appendChild(
        crearElemento(
          "h2",
          "",
          "Tiempo hasta la entrega"
        )
      );

      const porcentaje = calcularProgreso(
        pedido.fecha_pedido,
        pedido.fecha_entrega
      );

      const progresoNumero = crearElemento(
        "div",
        "progreso-numero",
        calcularDiasRestantes(pedido.fecha_entrega)
      );

      const subtitulo = crearElemento(
        "div",
        "progreso-subtitulo",
        "Tiempo restante para la entrega estimada"
      );

      const barraFondo = crearElemento(
        "div",
        "barra-fondo"
      );

      const barraRelleno = crearElemento(
        "div",
        "barra-relleno"
      );

      barraRelleno.style.width =
        (porcentaje ?? 0) + "%";

      barraFondo.appendChild(barraRelleno);

      const fechas = crearElemento(
        "div",
        "fechas"
      );

      const inicio = crearElemento(
        "div",
        "fecha-bloque"
      );

      inicio.append(
        crearElemento(
          "span",
          "fecha-etiqueta",
          "Confirmación"
        ),
        crearElemento(
          "span",
          "fecha-valor",
          fecha(pedido.fecha_pedido)
        )
      );

      const fin = crearElemento(
        "div",
        "fecha-bloque"
      );

      fin.append(
        crearElemento(
          "span",
          "fecha-etiqueta",
          "Entrega estimada"
        ),
        crearElemento(
          "span",
          "fecha-valor",
          fecha(pedido.fecha_entrega)
        )
      );

      fechas.append(inicio, fin);

      const aviso = crearElemento(
        "p",
        "aviso",
        "La barra muestra el tiempo transcurrido " +
        "hasta la fecha estimada de entrega. " +
        "No representa el avance real de fabricación."
      );

      tarjeta.append(
        progresoNumero,
        subtitulo,
        barraFondo,
        fechas,
        aviso
      );

      return tarjeta;
    }

    function crearResumenPago(pedido) {
      const tarjeta = crearElemento(
        "section",
        "tarjeta"
      );

      tarjeta.appendChild(
        crearElemento(
          "h2",
          "",
          "Resumen de pago"
        )
      );

      const total = Number(pedido.monto_total);

      if (
        pedido.monto_total === null ||
        !Number.isFinite(total) ||
        total <= 0
      ) {
        tarjeta.appendChild(
          crearElemento(
            "p",
            "aviso",
            "El importe del pedido todavía " +
            "no fue cargado."
          )
        );

        return tarjeta;
      }

      const sena = total / 2;
      const resto = total - sena;

      const senaPagada =
        pedido.sena_pagada === true;

      const saldoPagado =
        pedido.saldo_pagado === true;

      const totalFila = crearElemento(
        "div",
        "pago-total"
      );

      totalFila.append(
        crearElemento(
          "span",
          "etiqueta",
          "Total del pedido"
        ),
        crearElemento(
          "span",
          "importe",
          moneda(total)
        )
      );

      tarjeta.appendChild(totalFila);

      crearFilaPago(
        tarjeta,
        "Seña (50%)",
        "Primer pago del pedido",
        sena,
        senaPagada
      );

      crearFilaPago(
        tarjeta,
        "Pago final (50%)",
        "A pagar en la entrega",
        resto,
        saldoPagado
      );

      const pendiente =
        (senaPagada ? 0 : sena) +
        (saldoPagado ? 0 : resto);

      const filaPendiente = crearElemento(
        "div",
        "pago-total"
      );

      filaPendiente.style.borderBottom = "none";
      filaPendiente.style.paddingTop = "23px";
      filaPendiente.style.paddingBottom = "0";

      filaPendiente.append(
        crearElemento(
          "span",
          "etiqueta",
          "Total pendiente de pago"
        ),
        crearElemento(
          "span",
          "importe",
          moneda(pendiente)
        )
      );

      tarjeta.appendChild(filaPendiente);

      return tarjeta;
    }

    async function consultarPedido() {
      const token = new URLSearchParams(
        window.location.search
      ).get("token");

      const uuid =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

      if (!token || !uuid.test(token)) {
        resultado.textContent =
          "El enlace de seguimiento no es válido.";
        return;
      }

      try {
        const respuesta = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/consultar_pedido`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
              p_token: token
            })
          }
        );

        if (!respuesta.ok) {
          throw new Error(
            "Error de consulta: " + respuesta.status
          );
        }

        const datos = await respuesta.json();
        const pedido = datos[0];

        if (!pedido) {
          resultado.textContent =
            "No encontramos un pedido con este enlace.";
          return;
        }

        const contenido = crearElemento(
          "div",
          ""
        );

        const tarjetaDatos = crearElemento(
          "section",
          "tarjeta"
        );

        tarjetaDatos.appendChild(
          crearElemento(
            "h2",
            "",
            "Información del pedido"
          )
        );

        agregarFila(
          tarjetaDatos,
          "Cliente",
          pedido.cliente
        );

        agregarFila(
          tarjetaDatos,
          "N.º de pedido",
          pedido.numero_pedido
        );

        agregarFila(
          tarjetaDatos,
          "Productos",
          pedido.productos
        );

        const filaEstado = crearElemento(
          "div",
          "fila"
        );

        filaEstado.appendChild(
          crearElemento(
            "span",
            "etiqueta",
            "Estado"
          )
        );

        filaEstado.appendChild(
          crearElemento(
            "span",
            "estado",
            pedido.estado || "—"
          )
        );

        tarjetaDatos.appendChild(filaEstado);

        contenido.append(
          tarjetaDatos,
          crearProgreso(pedido),
          crearResumenPago(pedido)
        );

        resultado.replaceWith(contenido);

      } catch (error) {
        console.error(
          "Error al consultar:",
          error
        );

        resultado.textContent =
          "No pudimos consultar el pedido. " +
          "Intentá nuevamente.";
      }
    }

    consultarPedido();
  </script>
</body>
</html>
